services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alarmlock
      POSTGRES_PASSWORD: alarmlock
      POSTGRES_DB: alarmlock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alarmlock"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://alarmlock:alarmlock@postgres:5432/alarmlock?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      PORT: 3000
    ports:
      - "3000:3000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Must be a URL the *browser* (phone, laptop, whatever) can reach —
      # not "localhost", which from a phone resolves to the phone itself.
      # Use this machine's LAN IP (e.g. http://192.168.1.50:3000) to test
      # from another device on the same network. See README for the HTTPS
      # caveat that applies to camera access from a phone.
      API_URL: ${API_URL:-http://localhost:3000}
    ports:
      - "8080:80"

volumes:
  postgres_data:
